<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ffffff">
  <title>倪海厦中医教材</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="phone-frame">
    <div class="app-container">

      <!-- ==================== 首页（图1） ==================== -->
      <section class="page page-home active" data-page="home">
                <div class="app-header">
          <h1 class="app-title" id="board-title">视频版教材</h1>
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="5" stroke="#999" stroke-width="1.5"/>
              <line x1="11" y1="11" x2="14" y2="14" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" id="home-search" placeholder="查询当前板块中的内容" autocomplete="off">
            <button class="search-clear" id="search-clear" style="display:none">×</button>
          </div>
        </div>

        <div class="scrollable" id="home-content">
          <!-- 书籍分类容器（动态渲染） -->
          <div id="book-sections-container"></div>

          <!-- 搜索结果面板 -->
          <div class="search-results" id="search-results" style="display:none">
            <div class="search-result-header">
              <span>搜索结果</span>
              <span id="search-count" class="search-count"></span>
            </div>
            <div id="search-results-list"></div>
          </div>

          <div class="bottom-spacer"></div>
        </div>

        <div class="tab-bar">
          <a class="tab tab-active" data-tab="video" href="#">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M4 4 Q4 3 5 3 H10 Q11 3 11 4 V20 Q11 21 10 21 H5 Q4 21 4 20 Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M13 4 Q13 3 14 3 H19 Q20 3 20 4 V20 Q20 21 19 21 H14 Q13 21 13 20 Z" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>视频版教材</span>
          </a>
          <a class="tab" data-tab="nizhu" href="#">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M4 4 Q4 3 5 3 H10 Q11 3 11 4 V20 Q11 21 10 21 H5 Q4 21 4 20 Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M13 4 Q13 3 14 3 H19 Q20 3 20 4 V20 Q20 21 19 21 H14 Q13 21 13 20 Z" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            <span>倪注版教材</span>
          </a>
          <a class="tab" data-tab="search" href="#">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/>
              <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <span>搜索</span>
          </a>
          <a class="tab" data-tab="tianji" href="#">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M12 3.5 A8.5 8.5 0 0 1 12 20.5 A4.25 4.25 0 0 1 12 12 A4.25 4.25 0 0 0 12 3.5 Z" fill="currentColor"/>
            </svg>
            <span>天纪</span>
          </a>
          <a class="tab" data-tab="yian" href="#">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M17 3 L21 7 L9 19 L4 20 L5 15 Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <line x1="14" y1="6" x2="18" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>医案</span>
          </a>
        </div>
      </section>

      <!-- ==================== 章节列表页（图2） ==================== -->
      <section class="page page-jie" data-page="jie">
                <div class="app-header app-header-detail">
          <a class="back-btn" data-back="home">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M13 4 L7 10 L13 16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <h1 class="app-title app-title-center" id="jie-title">黄帝内经文字稿</h1>
        </div>

        <div class="scrollable" id="jie-content">
          <div class="top-tabs" id="top-tabs"></div>
          <div class="jie-list" id="jie-list"></div>
          <div class="bottom-spacer"></div>
        </div>
      </section>

      <!-- ==================== 全局搜索页 ==================== -->
      <section class="page page-search" data-page="search">
        <div class="app-header app-header-detail">
          <a class="back-btn" data-back="home">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M13 4 L7 10 L13 16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <div class="search-box search-box-expand">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="5" stroke="#999" stroke-width="1.5"/>
              <line x1="11" y1="11" x2="14" y2="14" stroke="#999" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" id="global-search" placeholder="搜索全部教材" autocomplete="off">
            <button class="search-clear" id="global-search-clear" style="display:none">×</button>
          </div>
        </div>

        <div class="scrollable" id="global-search-content">
          <div class="global-search-hint" id="global-search-hint">
            <div class="global-search-hint-icon">🔍</div>
            <p>输入关键词，搜索全部教材内容</p>
            <p class="global-search-hint-sub">可搜索书名、章节、条文、药方、讲解正文</p>
          </div>
          <div class="search-results" id="global-search-results" style="display:none">
            <div class="search-result-header">
              <span>搜索结果</span>
              <span id="global-search-count" class="search-count"></span>
            </div>
            <div id="global-search-results-list"></div>
          </div>
          <div class="bottom-spacer"></div>
        </div>
      </section>

      <!-- ==================== 内容详情页（图3） ==================== -->
      <section class="page page-content" data-page="content">
                <div class="app-header app-header-detail">
          <a class="back-btn" data-back="jie">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M13 4 L7 10 L13 16" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
          <h1 class="app-title app-title-center">文字稿内容详情</h1>
          <span style="width:32px;"></span>
        </div>

        <div class="scrollable" id="content-scroll">
          <article class="article" id="article"></article>
          <div class="bottom-spacer"></div>
        </div>

        <div class="content-toolbar">
          <a class="tool" id="btn-prev">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M19 5 L9 12 L19 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9 5 V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>上一篇</span>
          </a>
          <a class="tool" id="btn-hl" aria-label="切换高亮显示">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M12 3 L14.5 9 L21 10 L16 14.5 L17.5 21 L12 17.5 L6.5 21 L8 14.5 L3 10 L9.5 9 Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <span>高亮</span>
          </a>
          <a class="tool" id="btn-next">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M5 5 L15 12 L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15 5 V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>下一篇</span>
          </a>
        </div>
      </section>

    </div>
  </div>

  <script src="data.js?v=16"></script>
  <script src="data_chengdan.js?v=13"></script>
  <script src="app.js?v=14"></script>
</body>
</html>
